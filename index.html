<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد بروفايلات العمل الحر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 sm:p-8 border border-gray-100">
        <!-- شريط التقدم -->
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-2xl font-bold text-blue-600">بروفايل<span class="text-gray-900">برو</span></h1>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
            <div class="bg-blue-600 h-2 rounded-full transition-all duration-300" id="progressBar" style="width: 50%"></div>
        </div>

        <!-- الاستبيان -->
        <form id="profileForm" onsubmit="generateProfile(event)">
            
            <!-- الخطوة 1 -->
            <div class="step active" id="step1">
                <h2 class="text-xl font-bold mb-4">المعلومات الأساسية</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">المجال الدقيق (Niche)</label>
                        <input type="text" id="niche" placeholder="مثال: مصمم UI/UX للتطبيقات" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <button type="button" onclick="nextStep(2)" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mt-4 hover:bg-blue-700">التالي</button>
                </div>
            </div>

            <!-- الخطوة 2 -->
            <div class="step" id="step2">
                <h2 class="text-xl font-bold mb-4">الخبرة والمهارات</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">أهم المهارات (مفصولة بفاصلة)</label>
                        <input type="text" id="skills" placeholder="Figma, React, SEO..." class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div class="flex gap-4 mt-4">
                        <button type="button" onclick="nextStep(1)" class="w-1/3 bg-gray-200 text-gray-800 font-bold py-3 rounded-lg">رجوع</button>
                        <button type="submit" class="w-2/3 bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600">توليد البروفايل السحري 🚀</button>
                    </div>
                </div>
            </div>
        </form>
        
        <!-- مساحة عرض النتيجة -->
        <div id="resultArea" class="hidden mt-8">
            <h3 class="font-bold text-lg mb-4 text-green-600">تم توليد البروفايل بنجاح!</h3>
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <pre id="resultText" class="text-sm whitespace-pre-wrap text-left dir-ltr text-gray-700"></pre>
            </div>
        </div>
    </div>

    <script>
        function nextStep(step) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.getElementById('progressBar').style.width = (step * 50) + '%';
        }

        async function generateProfile(e) {
            e.preventDefault();
            
            const formData = {
                niche: document.getElementById('niche').value,
                skills: document.getElementById('skills').value
            };

            alert('جاري صياغة البروفايل بالذكاء الاصطناعي... تسنى ثواني.');

            try {
                // الاتصال بملف الباك-اند اللي غنصاوبوه من بعد
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                // عرض النتيجة
                document.getElementById('profileForm').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('resultText').textContent = JSON.stringify(result, null, 2);
                
            } catch (error) {
                alert('حدث خطأ. واش تأكدتي بلي حطيتي الـ API Key في Vercel؟');
            }
        }
    </script>
</body>
</html>
